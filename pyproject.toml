[project]
name = "ukedown"
version = "2.2.3"
description = "Markdown extensions for songsheet creation"
readme = "README.md"
authors = [{ name = "Stuart Sears", email = "stuart@sjsears.com" }]
requires-python = ">=3.10"
dependencies = ["markdown>=3.10.2"]

[project.urls]
"Bug Tracker" = "https://github.com/lanky/ukedown/issues"
repository = "https://github.com/lanky/ukedown"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.17"]
