[project]
name = "ukedown"
description = "Markdown extensions for songsheet creation"
license = "GPL-3.0-or-later"
dynamic = ["version"]
readme = "README.md"
authors = [{ name = "Stuart Sears", email = "stuart@sjsears.com" }]
requires-python = '>=3.11, <4.0'
dependencies = ["markdown (>=3.11.3,<4.0.0)"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/lanky/ukedown"
Issues = "https://github.com/lanky/ukedown/issues"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-markdown>=3.11.3.20261108",
]

[tool.uv]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
# pattern-prefix = "v"
