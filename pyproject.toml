[project]
name = "ukedown"
description = "Markdown extensions for songsheet creation"
license = "GPL-3.0-or-later"
version = "2.2.3"
readme = "README.md"
authors = [{ name = "Stuart Sears", email = "stuart@sjsears.com" }]
requires-python = '>=3.9'
dependencies = ['markdown>=3.5.2,<4.0.0']

[project.urls]
repository = "https://github.com/lanky/ukedown"
"Bug Tracker" = "https://github.com/lanky/ukedown/issues"

[dependency-groups]
dev = ['pytest>=8.0.1,<9.0.0', 'ruff>=0.2.2,<0.3.0']

[tool.poetry]
include = ["CHANGELOG.md", "LICENCE.txt"]
requires-poetry = '>=2.2.1'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
